name: Build DECKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v4
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Show compiler information
        shell: powershell
        run: |
          Write-Host "DMD:"
          dmd --version

          Write-Host ""
          Write-Host "C compiler:"
          cl.exe

      - name: Download official SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2025/sqlite-amalgamation-3530400.zip"
          $zip = "$env:RUNNER_TEMP\sqlite.zip"
          $dir = "$env:RUNNER_TEMP\sqlite"

          Write-Host "Downloading official SQLite amalgamation..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting SQLite..."
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $sqliteC = Get-ChildItem `
            -Path $dir `
            -Filter "sqlite3.c" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $sqliteC) {
            Write-Error "sqlite3.c was not found."
            exit 1
          }

          Write-Host "SQLite source found:"
          Write-Host $sqliteC.FullName

          "SQLITE_C=$($sqliteC.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build SQLite object with MSVC
        shell: powershell
        run: |
          $buildDir = "$env:RUNNER_TEMP\sqlite-build"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir |
            Out-Null

          Write-Host "Compiling SQLite with MSVC..."

          cl.exe `
            /nologo `
            /O2 `
            /c `
            "$env:SQLITE_C" `
            /Fo"$buildDir\sqlite3.obj"

          if (!(Test-Path "$buildDir\sqlite3.obj")) {
            Write-Error "sqlite3.obj was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "SQLite object successfully created:"
          Get-Item "$buildDir\sqlite3.obj"

          "SQLITE_OBJ=$buildDir\sqlite3.obj" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build DECKER
        shell: powershell
        working-directory: decker
        run: |
          Write-Host "======================================"
          Write-Host "Building official DECKER"
          Write-Host "======================================"

          dmd --version

          Write-Host ""
          Write-Host "SQLite object:"
          Get-Item "$env:SQLITE_OBJ"

          Write-Host ""
          Write-Host "Compiling and linking..."

          dmd -m64 decker.d "$env:SQLITE_OBJ" -of=decker.exe

          if (!(Test-Path "decker.exe")) {
            Write-Error "decker.exe was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DECKER BUILD SUCCESSFUL"
          Write-Host "======================================"

          Get-Item "decker.exe"

      - name: Test DECKER
        shell: powershell
        working-directory: decker
        run: |
          Write-Host "Testing DECKER..."

          & ".\decker.exe" --help

          if ($LASTEXITCODE -ne 0) {
            Write-Error "DECKER test failed."
            exit 1
          }

          Write-Host ""
          Write-Host "DECKER test passed successfully."

      - name: Upload DECKER EXE
        uses: actions/upload-artifact@v4
        with:
          name: decker-windows
          path: decker/decker.exe
          if-no-files-found: error

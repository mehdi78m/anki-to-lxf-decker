name: Build DECKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v5
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            Write-Error "Visual C++ installation was not found."
            exit 1
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            Write-Error "vcvars64.bat was not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          Write-Host "VC environment:"
          Write-Host $vcvars

          "VS_PATH=$vsPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "VCVARS=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify compiler environment
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo DMD
          echo ======================================
          dmd --version

          echo.
          echo ======================================
          echo Visual C++
          echo ======================================
          where cl

          echo.
          echo ======================================
          echo Microsoft Linker
          echo ======================================
          where link

      - name: Download official SQLite
        shell: powershell
        run: |
          Write-Host "Reading official SQLite download page..."

          $page = Invoke-WebRequest `
            -Uri "https://www.sqlite.org/download.html" `
            -UseBasicParsing

          $html = $page.Content

          Write-Host "Searching for official SQLite amalgamation..."

          $match = [regex]::Match(
            $html,
            'PRODUCT,([0-9]+\.[0-9]+\.[0-9]+),([^,]*sqlite-amalgamation-[0-9]+\.zip),'
          )

          if (!$match.Success) {
            Write-Error "Could not find the official SQLite amalgamation download."
            exit 1
          }

          $sqliteVersion = $match.Groups[1].Value
          $relativeUrl = $match.Groups[2].Value

          Write-Host "SQLite version:"
          Write-Host $sqliteVersion

          Write-Host "SQLite package:"
          Write-Host $relativeUrl

          $sqliteUrl = "https://www.sqlite.org/$relativeUrl"

          Write-Host "SQLite download URL:"
          Write-Host $sqliteUrl

          $zip = "$env:RUNNER_TEMP\sqlite.zip"
          $dir = "$env:RUNNER_TEMP\sqlite"

          Invoke-WebRequest `
            -Uri $sqliteUrl `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            Write-Error "SQLite download failed."
            exit 1
          }

          Write-Host "SQLite downloaded successfully."

          Write-Host "Extracting SQLite..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          $sqliteC = Get-ChildItem `
            -Path $dir `
            -Filter "sqlite3.c" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $sqliteC) {
            Write-Error "sqlite3.c was not found after extraction."
            exit 1
          }

          Write-Host "SQLite source found:"
          Write-Host $sqliteC.FullName

          "SQLITE_C=$($sqliteC.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build SQLite object
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING SQLITE
          echo ======================================

          mkdir "%RUNNER_TEMP%\sqlite-build"

          cl.exe ^
            /nologo ^
            /O2 ^
            /c ^
            "%SQLITE_C%" ^
            /Fo"%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

          if not exist "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" (
            echo ERROR: sqlite3.obj was not created.
            exit /b 1
          )

          echo.
          echo SQLite object created successfully:

          dir "%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

      - name: Build DECKER
        shell: cmd
        working-directory: decker
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING OFFICIAL DECKER
          echo ======================================

          echo.
          echo DMD:
          dmd --version

          echo.
          echo SQLite object:
          dir "%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

          echo.
          echo Compiling and linking DECKER...

          dmd -m64 decker.d "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" -of=decker.exe

          if not exist "decker.exe" (
            echo ERROR: decker.exe was not created.
            exit /b 1
          )

          echo.
          echo ======================================
          echo DECKER BUILD SUCCESSFUL
          echo ======================================

          dir decker.exe

      - name: Test DECKER executable
        shell: cmd
        working-directory: decker
        run: |
          echo ======================================
          echo TESTING DECKER EXECUTABLE
          echo ======================================

          if not exist "decker.exe" (
            echo ERROR: decker.exe does not exist.
            exit /b 1
          )

          echo.
          echo Testing executable directly...

          decker.exe

          echo.
          echo DECKER returned to command line.
          echo This is expected because no input file was supplied.

          echo.
          echo ======================================
          echo DECKER EXECUTABLE TEST PASSED
          echo ======================================

      - name: Create Windows launcher
        shell: powershell
        working-directory: decker
        run: |
          $launcher = @'
          @echo off
          title DECKER - Anki to Lexilize Converter

          echo.
          echo ==========================================
          echo DECKER - Anki to Lexilize Converter
          echo ==========================================
          echo.
          echo Usage:
          echo   decker.exe [options] input.apkg output.lxf
          echo.
          echo Examples:
          echo   decker.exe --verbose input.apkg output.lxf
          echo.
          echo Press any key to close this window.
          echo.

          pause >nul
          '@

          Set-Content `
            -Path "Run_DECKER.cmd" `
            -Value $launcher `
            -Encoding ascii

      - name: Create README
        shell: powershell
        working-directory: decker
        run: |
          $readme = @'
          DECKER Windows

          This package contains the official DECKER executable.

          Files:
          - decker.exe
            Official DECKER command-line executable.

          - Run_DECKER.cmd
            Opens a command window and shows basic usage.

          DECKER command format:

          decker.exe [options] input_file_path output_file_path

          Supported input formats:
          - Anki .apkg
          - CSV .csv

          Supported output formats:
          - Lexilize .lxf
          - CSV .csv

          Example:

          decker.exe --verbose input.apkg output.lxf

          For media:

          decker.exe --media_folder "MEDIA_FOLDER" --dump_folder "DUMP_FOLDER" --verbose input.apkg output.lxf

          This executable is the official DECKER project by SenseLogic.
          '@

          Set-Content `
            -Path "README.txt" `
            -Value $readme `
            -Encoding utf8

      - name: Show final package
        shell: cmd
        working-directory: decker
        run: |
          echo ======================================
          echo FINAL DECKER PACKAGE
          echo ======================================

          dir decker.exe
          dir Run_DECKER.cmd
          dir README.txt

      - name: Upload DECKER Windows package
        uses: actions/upload-artifact@v5
        with:
          name: decker-windows
          path: |
            decker/decker.exe
            decker/Run_DECKER.cmd
            decker/README.txt
          if-no-files-found: error

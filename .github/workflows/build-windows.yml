name: Build DECKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v4
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            Write-Error "Visual C++ installation was not found."
            exit 1
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            Write-Error "vcvars64.bat was not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          Write-Host "VC environment:"
          Write-Host $vcvars

          "VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCVARS=$vcvars" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify compiler environment
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo DMD
          echo ======================================
          dmd --version

          echo.
          echo ======================================
          echo Visual C++
          echo ======================================
          where cl

          echo.
          echo ======================================
          echo Microsoft Linker
          echo ======================================
          where link

      - name: Download SQLite
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2025/sqlite-amalgamation-3530400.zip"
          $zip = "$env:RUNNER_TEMP\sqlite.zip"
          $dir = "$env:RUNNER_TEMP\sqlite"

          Write-Host "Downloading SQLite 3.53.4..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          if (!(Test-Path $zip)) {
            Write-Error "SQLite download failed."
            exit 1
          }

          Write-Host "Extracting SQLite..."
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $sqliteC = Get-ChildItem `
            -Path $dir `
            -Filter "sqlite3.c" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $sqliteC) {
            Write-Error "sqlite3.c was not found."
            exit 1
          }

          Write-Host "SQLite source:"
          Write-Host $sqliteC.FullName

          "SQLITE_C=$($sqliteC.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build SQLite object
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING SQLITE
          echo ======================================

          mkdir "%RUNNER_TEMP%\sqlite-build"

          cl.exe ^
            /nologo ^
            /O2 ^
            /c ^
            "%SQLITE_C%" ^
            /Fo"%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

          if not exist "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" (
            echo ERROR: sqlite3.obj was not created.
            exit /b 1
          )

          echo.
          echo SQLite object created successfully:

          dir "%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

      - name: Build DECKER
        shell: cmd
        working-directory: decker
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING OFFICIAL DECKER
          echo ======================================

          echo.
          echo DMD:
          dmd --version

          echo.
          echo SQLite object:
          dir "%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

          echo.
          echo Compiling and linking DECKER...

          dmd -m64 decker.d "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" -of=decker.exe

          if not exist "decker.exe" (
            echo ERROR: decker.exe was not created.
            exit /b 1
          )

          echo.
          echo ======================================
          echo DECKER BUILD SUCCESSFUL
          echo ======================================

          dir decker.exe

      - name: Test DECKER
        shell: cmd
        working-directory: decker
        run: |
          echo ======================================
          echo TESTING DECKER
          echo ======================================

          decker.exe --help

          if errorlevel 1 (
            echo ERROR: DECKER test failed.
            exit /b 1
          )

          echo.
          echo DECKER test passed successfully.

      - name: Upload DECKER EXE
        uses: actions/upload-artifact@v4
        with:
          name: decker-windows
          path: decker/decker.exe
          if-no-files-found: error

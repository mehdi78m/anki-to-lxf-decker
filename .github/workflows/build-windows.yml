name: Build DECKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v4
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        shell: powershell
        run: |
          choco install dmd -y

          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          if (!(Test-Path $dmd)) {
            Write-Error "DMD was not found at $dmd"
            exit 1
          }

          & $dmd --version

      - name: Install SQLite
        shell: powershell
        run: |
          choco install sqlite -y

          $sqlite = Get-ChildItem `
            -Path "C:\ProgramData\chocolatey\lib\sqlite" `
            -Recurse `
            -Filter "sqlite3.lib" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $sqlite) {
            Write-Error "sqlite3.lib was not found."
            exit 1
          }

          Write-Host "SQLite library found:"
          Write-Host $sqlite.FullName

          "SQLITE_LIB_DIR=$($sqlite.DirectoryName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Build DECKER
        shell: powershell
        working-directory: decker
        run: |
          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          Write-Host "Building DECKER..."
          Write-Host "SQLite library directory: $env:SQLITE_LIB_DIR"

          & $dmd -m64 decker.d `
            -of=decker.exe `
            "-L+sqlite3.lib" `
            "-L+LIBPATH:$env:SQLITE_LIB_DIR"

          if (!(Test-Path "decker.exe")) {
            Write-Error "decker.exe was not created."
            exit 1
          }

          Write-Host "DECKER successfully built:"
          Get-Item "decker.exe"

      - name: Upload DECKER EXE
        uses: actions/upload-artifact@v4
        with:
          name: decker-windows
          path: decker/decker.exe

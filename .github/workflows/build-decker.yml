name: Build DECKER for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v4
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        shell: powershell
        run: |
          choco install dmd -y

      - name: Verify DMD
        shell: powershell
        run: |
          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          if (-not (Test-Path $dmd)) {
            Write-Host "DMD was not found at:"
            Write-Host $dmd
            Write-Host ""
            Write-Host "Searching for dmd.exe..."
            
            Get-ChildItem "C:\D" -Filter dmd.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            exit 1
          }

          Write-Host "DMD found:"
          Write-Host $dmd

          & $dmd --version

      - name: Build DECKER
        shell: powershell
        working-directory: decker
        run: |
          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          if (-not (Test-Path $dmd)) {
            Write-Error "DMD executable was not found."
            exit 1
          }

          Write-Host "DECKER source files:"
          Get-ChildItem

          Write-Host ""
          Write-Host "Building decker.exe..."

          & $dmd -m64 decker.d -of=decker.exe

          if ($LASTEXITCODE -ne 0) {
            Write-Error "DMD compilation failed."
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "decker.exe")) {
            Write-Error "Compilation finished but decker.exe was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "================================="
          Write-Host "DECKER BUILD SUCCESSFUL"
          Write-Host "================================="

          Get-Item decker.exe

      - name: Upload decker.exe
        uses: actions/upload-artifact@v4
        with:
          name: decker-exe
          path: decker/decker.exe
          if-no-files-found: error

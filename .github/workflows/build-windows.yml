name: Build DECKER GUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v5
        with:
          repository: senselogic/DECKER
          path: decker

      - name: Install DMD
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            Write-Error "Visual C++ installation was not found."
            exit 1
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            Write-Error "vcvars64.bat was not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          Write-Host "VC environment:"
          Write-Host $vcvars

          "VS_PATH=$vsPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "VCVARS=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify compiler environment
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo DMD
          echo ======================================
          dmd --version

          echo.
          echo ======================================
          echo Visual C++
          echo ======================================
          where cl

          echo.
          echo ======================================
          echo Microsoft Linker
          echo ======================================
          where link

      - name: Download official SQLite
        shell: powershell
        run: |
          Write-Host "Reading official SQLite download page..."

          $page = Invoke-WebRequest `
            -Uri "https://www.sqlite.org/download.html" `
            -UseBasicParsing

          $html = $page.Content

          Write-Host "Searching for official SQLite amalgamation..."

          $match = [regex]::Match(
            $html,
            'PRODUCT,([0-9]+\.[0-9]+\.[0-9]+),([^,]*sqlite-amalgamation-[0-9]+\.zip),'
          )

          if (!$match.Success) {
            Write-Error "Could not find the official SQLite amalgamation download."
            exit 1
          }

          $sqliteVersion = $match.Groups[1].Value
          $relativeUrl = $match.Groups[2].Value

          Write-Host "SQLite version:"
          Write-Host $sqliteVersion

          Write-Host "SQLite package:"
          Write-Host $relativeUrl

          $sqliteUrl = "https://www.sqlite.org/$relativeUrl"

          Write-Host "SQLite download URL:"
          Write-Host $sqliteUrl

          $zip = "$env:RUNNER_TEMP\sqlite.zip"
          $dir = "$env:RUNNER_TEMP\sqlite"

          Invoke-WebRequest `
            -Uri $sqliteUrl `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            Write-Error "SQLite download failed."
            exit 1
          }

          Write-Host "SQLite downloaded successfully."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          $sqliteC = Get-ChildItem `
            -Path $dir `
            -Filter "sqlite3.c" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $sqliteC) {
            Write-Error "sqlite3.c was not found after extraction."
            exit 1
          }

          Write-Host "SQLite source found:"
          Write-Host $sqliteC.FullName

          "SQLITE_C=$($sqliteC.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build SQLite object
        shell: cmd
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING SQLITE
          echo ======================================

          mkdir "%RUNNER_TEMP%\sqlite-build"

          cl.exe ^
            /nologo ^
            /O2 ^
            /c ^
            "%SQLITE_C%" ^
            /Fo"%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

          if not exist "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" (
            echo ERROR: sqlite3.obj was not created.
            exit /b 1
          )

          dir "%RUNNER_TEMP%\sqlite-build\sqlite3.obj"

      - name: Build official DECKER
        shell: cmd
        working-directory: decker
        run: |
          call "%VCVARS%"

          echo ======================================
          echo BUILDING OFFICIAL DECKER
          echo ======================================

          dmd --version

          dmd -m64 decker.d "%RUNNER_TEMP%\sqlite-build\sqlite3.obj" -of=decker.exe

          if not exist "decker.exe" (
            echo ERROR: decker.exe was not created.
            exit /b 1
          )

          echo.
          echo ======================================
          echo OFFICIAL DECKER BUILD SUCCESSFUL
          echo ======================================

          dir decker.exe

      - name: Verify DECKER executable
        shell: powershell
        working-directory: decker
        run: |
          $exe = Join-Path (Get-Location) "decker.exe"

          if (!(Test-Path $exe)) {
            Write-Error "decker.exe was not created."
            exit 1
          }

          $file = Get-Item $exe

          if ($file.Length -le 0) {
            Write-Error "decker.exe is empty."
            exit 1
          }

          Write-Host "DECKER executable:"
          Write-Host $file.FullName

          Write-Host "Size:"
          Write-Host $file.Length

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Create DECKER GUI source
        shell: powershell
        working-directory: decker
        run: |
          $gui = @'
          import os
          import sys
          import subprocess
          import threading
          import tkinter as tk
          from tkinter import filedialog, messagebox, ttk


          APP_TITLE = "DECKER - مبدل Anki به Lexilize"


          def get_decker_path():
              if getattr(sys, "frozen", False):
                  base_dir = getattr(sys, "_MEIPASS", os.path.dirname(sys.executable))
              else:
                  base_dir = os.path.dirname(os.path.abspath(__file__))

              return os.path.join(base_dir, "decker.exe")


          def choose_input():
              path = filedialog.askopenfilename(
                  title="انتخاب فایل Anki",
                  filetypes=[
                      ("Anki Package", "*.apkg"),
                      ("All files", "*.*")
                  ]
              )

              if path:
                  input_var.set(path)

                  if not output_var.get():
                      base, _ = os.path.splitext(path)
                      output_var.set(base + ".lxf")


          def choose_output():
              path = filedialog.asksaveasfilename(
                  title="انتخاب فایل خروجی",
                  defaultextension=".lxf",
                  filetypes=[
                      ("Lexilize File", "*.lxf"),
                      ("All files", "*.*")
                  ]
              )

              if path:
                  output_var.set(path)


          def set_enabled(enabled):
              state = "normal" if enabled else "disabled"
              input_button.config(state=state)
              output_button.config(state=state)
              convert_button.config(state=state)


          def run_conversion():
              input_file = input_var.get().strip()
              output_file = output_var.get().strip()

              if not input_file:
                  messagebox.showwarning(
                      "فایل ورودی",
                      "لطفاً فایل Anki با پسوند .apkg را انتخاب کنید."
                  )
                  return

              if not os.path.isfile(input_file):
                  messagebox.showerror(
                      "خطا",
                      "فایل ورودی پیدا نشد."
                  )
                  return

              if not output_file:
                  messagebox.showwarning(
                      "فایل خروجی",
                      "لطفاً محل فایل خروجی LXF را مشخص کنید."
                  )
                  return

              output_dir = os.path.dirname(os.path.abspath(output_file))

              if output_dir and not os.path.isdir(output_dir):
                  try:
                      os.makedirs(output_dir, exist_ok=True)
                  except Exception as exc:
                      messagebox.showerror(
                          "خطا",
                          "ساخت پوشه خروجی ممکن نشد:\n\n" + str(exc)
                      )
                      return

              if os.path.abspath(input_file) == os.path.abspath(output_file):
                  messagebox.showerror(
                      "خطا",
                      "فایل ورودی و خروجی نمی‌توانند یکسان باشند."
                  )
                  return

              decker = get_decker_path()

              if not os.path.isfile(decker):
                  messagebox.showerror(
                      "خطای DECKER",
                      "فایل موتور DECKER پیدا نشد."
                  )
                  return

              set_enabled(False)
              status_var.set("در حال تبدیل...")
              progress.start(10)

              thread = threading.Thread(
                  target=conversion_worker,
                  args=(decker, input_file, output_file),
                  daemon=True
              )

              thread.start()


          def conversion_worker(decker, input_file, output_file):
              try:
                  command = [
                      decker,
                      input_file,
                      output_file
                  ]

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      cwd=os.path.dirname(decker)
                  )

                  root.after(
                      0,
                      conversion_finished,
                      result.returncode,
                      result.stdout,
                      output_file
                  )

              except Exception as exc:
                  root.after(
                      0,
                      conversion_exception,
                      str(exc)
                  )


          def conversion_finished(returncode, log, output_file):
              progress.stop()
              set_enabled(True)

              if returncode == 0 and os.path.isfile(output_file):
                  status_var.set("تبدیل با موفقیت انجام شد.")

                  messagebox.showinfo(
                      "تبدیل موفق",
                      "تبدیل با موفقیت انجام شد.\n\n"
                      "فایل خروجی:\n"
                      + output_file
                  )

              else:
                  status_var.set("تبدیل ناموفق بود.")

                  details = log.strip()

                  if not details:
                      details = "DECKER کد خطای " + str(returncode) + " برگرداند."

                  messagebox.showerror(
                      "خطا در تبدیل",
                      "تبدیل انجام نشد.\n\n" + details
                  )


          def conversion_exception(error_text):
              progress.stop()
              set_enabled(True)
              status_var.set("خطا")

              messagebox.showerror(
                  "خطا",
                  "اجرای DECKER ممکن نشد.\n\n" + error_text
              )


          root = tk.Tk()
          root.title(APP_TITLE)
          root.geometry("760x300")
          root.minsize(700, 280)
          root.resizable(True, False)


          main = ttk.Frame(root, padding=20)
          main.pack(fill="both", expand=True)


          title = ttk.Label(
              main,
              text="DECKER - مبدل Anki به Lexilize",
              font=("Segoe UI", 16, "bold")
          )

          title.pack(anchor="e", pady=(0, 20))


          input_frame = ttk.Frame(main)
          input_frame.pack(fill="x", pady=5)


          ttk.Label(
              input_frame,
              text="فایل ورودی Anki (.apkg):",
              width=25,
              anchor="e"
          ).pack(side="right")


          input_var = tk.StringVar()


          input_entry = ttk.Entry(
              input_frame,
              textvariable=input_var
          )

          input_entry.pack(
              side="right",
              fill="x",
              expand=True,
              padx=8
          )


          input_button = ttk.Button(
              input_frame,
              text="انتخاب...",
              command=choose_input
          )

          input_button.pack(side="left")


          output_frame = ttk.Frame(main)
          output_frame.pack(fill="x", pady=5)


          ttk.Label(
              output_frame,
              text="فایل خروجی (.lxf):",
              width=25,
              anchor="e"
          ).pack(side="right")


          output_var = tk.StringVar()


          output_entry = ttk.Entry(
              output_frame,
              textvariable=output_var
          )

          output_entry.pack(
              side="right",
              fill="x",
              expand=True,
              padx=8
          )


          output_button = ttk.Button(
              output_frame,
              text="انتخاب...",
              command=choose_output
          )

          output_button.pack(side="left")


          convert_button = ttk.Button(
              main,
              text="تبدیل فایل",
              command=run_conversion
          )

          convert_button.pack(
              pady=(25, 10),
              ipadx=25,
              ipady=5
          )


          progress = ttk.Progressbar(
              main,
              mode="indeterminate"
          )

          progress.pack(fill="x", pady=5)


          status_var = tk.StringVar(
              value="آماده"
          )


          status = ttk.Label(
              main,
              textvariable=status_var,
              anchor="center"
          )

          status.pack(fill="x", pady=5)


          root.mainloop()
          '@

          Set-Content `
            -Path "decker_gui.py" `
            -Value $gui `
            -Encoding utf8

      - name: Build GUI EXE
        shell: cmd
        working-directory: decker
        run: |
          echo ======================================
          echo BUILDING DECKER GUI EXE
          echo ======================================

          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name DECKER_GUI ^
            --add-binary "decker.exe;." ^
            decker_gui.py

          if not exist "dist\DECKER_GUI.exe" (
            echo ERROR: DECKER_GUI.exe was not created.
            exit /b 1
          )

          echo.
          echo ======================================
          echo GUI BUILD SUCCESSFUL
          echo ======================================

          dir "dist\DECKER_GUI.exe"

      - name: Test GUI EXE exists
        shell: powershell
        working-directory: decker
        run: |
          $exe = Join-Path (Get-Location) "dist\DECKER_GUI.exe"

          if (!(Test-Path $exe)) {
              Write-Error "DECKER_GUI.exe was not created."
              exit 1
          }

          $file = Get-Item $exe

          if ($file.Length -le 0) {
              Write-Error "DECKER_GUI.exe is empty."
              exit 1
          }

          Write-Host "GUI EXE:"
          Write-Host $file.FullName

          Write-Host "Size:"
          Write-Host $file.Length

          Write-Host ""
          Write-Host "======================================"
          Write-Host "GUI EXE VERIFICATION PASSED"
          Write-Host "======================================"

      - name: Prepare final package
        shell: powershell
        working-directory: decker
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "final-package" |
            Out-Null

          Copy-Item `
            "dist\DECKER_GUI.exe" `
            "final-package\DECKER_GUI.exe"

          $readme = @'
          DECKER GUI

          DECKER_GUI.exe is a graphical Windows interface for the official DECKER engine.

          How to use:

          1. Run DECKER_GUI.exe
          2. Select your Anki .apkg file.
          3. Select the output .lxf file.
          4. Click "تبدیل فایل".

          The official DECKER engine is embedded inside the executable.

          Current version:
          - Input: Anki .apkg
          - Output: Lexilize .lxf

          Additional DECKER options will be added after the basic conversion
          has been tested successfully with a real Anki deck.
          '@

          Set-Content `
            -Path "final-package\README.txt" `
            -Value $readme `
            -Encoding utf8

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FINAL PACKAGE"
          Write-Host "======================================"

          Get-ChildItem "final-package"

      - name: Upload DECKER GUI
        uses: actions/upload-artifact@v5
        with:
          name: DECKER-GUI-Windows
          path: |
            decker/final-package/DECKER_GUI.exe
            decker/final-package/README.txt
          if-no-files-found: error

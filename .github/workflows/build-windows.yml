name: Build DECKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout official DECKER
        uses: actions/checkout@v4
        with:
          repository: senselogic/DECKER
          ref: master
          path: decker

      - name: Install DMD
        shell: powershell
        run: |
          choco install dmd -y

          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          if (!(Test-Path $dmd)) {
            Write-Error "DMD was not found at $dmd"
            exit 1
          }

          & $dmd --version

      - name: Build DECKER
        shell: powershell
        working-directory: decker
        run: |
          $dmd = "C:\D\dmd2\windows\bin64\dmd.exe"

          Write-Host "Building DECKER..."
          & $dmd -m64 decker.d -of=decker.exe

          if (!(Test-Path "decker.exe")) {
            Write-Error "decker.exe was not created."
            exit 1
          }

          Write-Host "DECKER successfully built:"
          Get-Item "decker.exe"

      - name: Upload DECKER EXE
        uses: actions/upload-artifact@v4
        with:
          name: decker-windows
          path: decker/decker.exe
